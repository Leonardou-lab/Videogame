<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Coward King — Game Board</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">

        <!-- HUD bar -->
        <div id="hud">
            <span class="hud-item">LEVEL <span>1</span></span>
            <span class="hud-item">HORDE <span>1/3</span></span>
            <span class="hud-item">TURN <span>5/30</span></span>
            <span class="hud-item">AP: <span>5</span></span>
            <span class="hud-item">GOLD: <span>10</span></span>
        </div>

        <!-- Board -->
        <div id="board-area">
            <div id="board"></div>
        </div>

        <!-- Hand zone -->
        <div id="hand"></div>

    </div>

    <script src="js/board.js"></script>
</body>
</html>
