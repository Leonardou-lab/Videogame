<!DOCTYPE html>
<html>
    <head>
        <title>The Coward King - Prototype</title>
        <link rel="stylesheet" href="css/the_coward_king.css">

        <script src="js/libs/game_functions.js"></script>
        <script src="js/libs/Rect.js"></script>
        <script src="js/libs/Vector.js"></script>
        <script src="js/libs/GameObject.js"></script>
        <script src="js/libs/TextLabel.js"></script>
        <script src="js/12_coward_king_prototype.js"></script>
    </head>

    <body>
        <div id="app">
            <div id="hud">
                <span class="hud-item">LEVEL <span id="hud-level">1</span></span>
                <span class="hud-item">HORDE <span id="hud-horde">1/3</span></span>
                <span class="hud-item">TURN <span id="hud-turn">5/30</span></span>
                <span class="hud-item">AP: <span id="hud-ap">5</span></span>
                <span class="hud-item">GOLD: <span id="hud-gold">10</span></span>
            </div>

            <main id="board-area">
                <canvas id="canvas"></canvas>
            </main>

            <footer id="bottomPanel">
                <section id="handPanel">
                    <h2>Hand</h2>
                    <div id="hand"></div>
                </section>

                <section id="controls" aria-label="Game controls">
                    <button id="moveKingButton">Move King</button>
                    <button id="endTurnButton">End Turn</button>
                    <button id="restartButton">Restart</button>
                </section>

                <section id="logPanel">
                    <h2>Log</h2>
                    <div id="log"></div>
                </section>
            </footer>
        </div>

        <script>
            main();
        </script>
    </body>
</html>
