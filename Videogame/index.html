<!DOCTYPE html>
<html>
    <head>
        <title>The Coward King - Prototype</title>
        <link rel="stylesheet" href="css/the_coward_king.css">

        <!-- Engine libs -->
        <script src="js/libs/game_functions.js"></script>
        <script src="js/libs/Rect.js"></script>
        <script src="js/libs/Vector.js"></script>
        <script src="js/libs/GameObject.js"></script>
        <script src="js/libs/TextLabel.js"></script>

        <!-- Game modules (load order matters) -->
        <script src="js/constants.js"></script>
        <script src="js/api.js"></script>
        <script src="js/tileMath.js"></script>
        <script src="js/sprites.js"></script>
        <script src="js/renderer.js"></script>
        <script src="js/entities.js"></script>
        <script src="js/12_coward_king_prototype.js"></script>
        <script src="js/board.js"></script>
        <script src="js/movement.js"></script>
        <script src="js/combat.js"></script>
        <script src="js/turn.js"></script>
        <script src="js/ui.js"></script>
    </head>

    <body>
        <div id="app">
            <main id="game-layout">
                <section id="handPanel">
                    <h2>Cards</h2>
                    <div id="hand"></div>
                </section>

                <section id="board-area" aria-label="Game board">
                    <canvas id="canvas"></canvas>
                </section>

                <section id="sidePanel" aria-label="Game information and controls">
                    <div id="hud-section">
                        <div id="hud-top">
                            <button id="menuButton">&#9776; Menu</button>
                        </div>
                        <div id="hud"></div>
                    </div>
                    <section id="desperationPanel"></section>
                    <section id="controls" aria-label="Game controls">
                        <button id="moveKingButton">Move King</button>
                        <button id="endTurnButton">End Turn</button>
                        <button id="upgradesButton">Upgrades</button>
                        <button id="restartButton">Restart</button>
                    </section>
                    <div id="log" aria-hidden="true"></div>
                </section>
            </main>

            <div id="pauseOverlay" class="pause-overlay">
                <div class="pause-panel">
                    <h2>&#9680; Paused</h2>
                    <div class="pause-buttons">
                        <button id="resumeGameBtn">Resume</button>
                        <button id="saveGameBtn">Save Game</button>
                        <button id="goToMenuBtn">Go Back to Menu</button>
                    </div>
                    <div id="saveConfirmMsg" class="save-confirm"></div>
                </div>
            </div>

            <div id="upgradeOverlay" class="upgrade-overlay">
                <div class="upgrade-panel">
                    <div class="upgrade-header">
                        <h2>&#9876; Card Upgrades</h2>
                        <span id="upgradeGoldDisplay" class="upgrade-gold">Gold: 0</span>
                        <button id="closeUpgradesButton" class="close-upgrade-btn">&#10005; Back</button>
                    </div>
                    <div id="upgradeCardList"></div>
                </div>
            </div>
        </div>

        <script>
            main();
        </script>
    </body>
</html>
